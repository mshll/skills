<!doctype html><html><head><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="drift-tokens.css"><style>
body{font:14px/1.4 var(--font-sans);margin:0;padding:16px;background:#fff;color:#111}
.card{border:1px solid #ddd;border-radius:var(--radius-container);padding:16px;max-width:420px}
.inner{border-radius:7px;background:#f4f4f4;padding:12px;margin-top:12px}
.title{font-weight:600}.sub{color:#555;margin-top:4px}
.id{font-family:var(--font-mono)}
.off{font-family:Georgia,serif;margin-top:8px}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:var(--radius-control);background:#111;color:#fff;font:inherit;margin-top:16px}
.pill{display:inline-block;border-radius:999px;background:#eee;padding:4px 12px;margin-top:8px}
.odd{border-radius:14px;background:#eee;padding:12px;margin-top:12px}
</style></head><body>
<div class="card"><div class="title">Invoice <span class="id">INV-2041</span></div><div class="sub">Due in 3 days</div>
<div class="off">Set in a face the tokens do not name</div>
<div class="inner">Nested radius, one pixel under its container</div>
<div class="pill">Paid</div>
<div class="odd">A radius the tokens do not name</div>
<button class="btn">Pay invoice</button></div>
</body></html>
