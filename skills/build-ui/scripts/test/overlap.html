<!doctype html><html><head><meta name="viewport" content="width=device-width"><style>
body{font:14px/20px system-ui;margin:0;padding:16px;background:#fff;color:#111}
::selection{background:#cfe0ff}
section{margin-bottom:32px;max-width:320px}
button{font:inherit;color:inherit;height:44px;padding:0 16px;border:1px solid #888;border-radius:6px;background:#fff;flex:none}
.row{display:flex;gap:12px;align-items:center}
#o1 .info{flex:1;min-width:0}
#o1 .room{white-space:nowrap}
#o2 .ruler{display:flex;gap:2px;width:120px;flex:none;align-items:center}
#o2 .tick{width:6px;height:16px;background:#999;flex:none}
#o2 .more{flex:none}
#o3 .meta{width:130px;margin:0 0 12px}
#o3 .parts{display:flex;flex-wrap:wrap;column-gap:4px;width:150px;margin:0}
</style></head><body>
<section id="o1"><div class="row"><div class="info"><div>Fiddle-leaf fig</div><div><span class="room">Upstairs bathroom, north-facing window ledge</span></div></div><button>Water</button></div></section>
<section id="o2"><div class="row"><div class="ruler"><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><span class="more">+16</span></div><button>Water</button></div></section>
<section id="o3"><p class="meta">Watered 3 days ago · Kitchen sill · Needs water</p><p class="parts"><span>Watered 3 days ago</span><span>· Kitchen sill</span><span>· Needs water</span></p></section>
</body></html>
