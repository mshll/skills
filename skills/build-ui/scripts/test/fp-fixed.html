<!doctype html><html><head><meta name="viewport" content="width=device-width"><style>
body{font:14px/20px system-ui;margin:0;padding:16px 16px 400px;background:#fff;color:#111;min-height:1400px}
::selection{background:#cfe0ff}
button{font:inherit;color:inherit}
.sheet{position:fixed;left:0;right:0;top:180px;background:#f6f6f6;border-radius:16px 16px 0 0;padding:8px 20px 20px;max-width:480px}
.handle{width:36px;height:5px;border-radius:999px;background:#bbb;margin:0 auto 12px}
.sheet h2{margin:0 0 8px;font-size:17px;line-height:24px}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#f2f2f2;padding:12px 20px 34px}
.actionbar .btn{width:100%;min-height:52px;border:0;border-radius:10px;background:#111;color:#fff}
</style></head><body>
<p>Today</p>
<div class="sheet"><div class="handle"></div><h2>Log a drink</h2><p>Pick what you just had.</p></div>
<div class="actionbar"><button class="btn">Log a drink</button></div>
</body></html>
